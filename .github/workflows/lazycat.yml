name: Lazycat Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: ca-x/lazycat-github-action@v1
    with:
      build_config: ./.github/lazycat-action.yml
      toolchains: docker
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_API_BASE_URL: ${{ secrets.APPSTORE_API_BASE_URL }}
      APPSTORE_API_TOKEN: ${{ secrets.APPSTORE_API_TOKEN }}
